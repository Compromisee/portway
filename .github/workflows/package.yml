name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  onefile:
    name: One-file ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            artifact: portway-linux
          - os: macos-latest
            label: macos
            artifact: portway-macos
          - os: windows-latest
            label: windows
            artifact: portway-windows.exe
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build one-file binary
        run: python -m PyInstaller --noconfirm --clean packaging/portway.spec

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist-app
          if [ -f dist/portway.exe ]; then
            cp dist/portway.exe "dist-app/${{ matrix.artifact }}"
          elif [ -f dist/portway ]; then
            cp dist/portway "dist-app/${{ matrix.artifact }}"
            chmod +x "dist-app/${{ matrix.artifact }}"
          else
            echo "One-file binary not found in dist/"
            ls -la dist || true
            exit 1
          fi
          ls -lh dist-app

      - name: Upload one-file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-app/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: onefile
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -lh artifacts

      - name: Choose release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "title=Portway ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=onefile-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "title=Portway one-file build ${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            artifacts/portway-linux
            artifacts/portway-macos
            artifacts/portway-windows.exe
          body: |
            One-file Portway builds (GUI, Flask, TUI, and CLI).

            | File | Platform |
            | --- | --- |
            | `portway-linux` | Linux |
            | `portway-macos` | macOS |
            | `portway-windows.exe` | Windows |

            Download, mark executable on Unix (`chmod +x portway-linux`), then run it.
