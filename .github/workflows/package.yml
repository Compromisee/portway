name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  onefile:
    name: One-file ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            artifact: portway-linux
          - os: macos-latest
            label: macos
            artifact: portway-macos
          - os: windows-latest
            label: windows
            artifact: portway-windows.exe
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build one-file binary
        run: python -m PyInstaller --noconfirm --clean packaging/portway.spec

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist-app
          if [ -f dist/portway.exe ]; then
            cp dist/portway.exe "dist-app/${{ matrix.artifact }}"
          elif [ -f dist/portway ]; then
            cp dist/portway "dist-app/${{ matrix.artifact }}"
            chmod +x "dist-app/${{ matrix.artifact }}"
          else
            echo "One-file binary not found in dist/"
            ls -la dist || true
            exit 1
          fi
          ls -lh dist-app

      - name: Upload one-file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-app/${{ matrix.artifact }}
          if-no-files-found: error
