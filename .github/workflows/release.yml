name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: portway-linux
          - os: macos-latest
            artifact: portway-macos
          - os: windows-latest
            artifact: portway-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: PyInstaller
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            DATA_PATH="portway/web;portway/web"
          else
            DATA_PATH="portway/web:portway/web"
          fi
          python -m PyInstaller --noconfirm --clean --name portway --add-data "$DATA_PATH" --collect-all webview portway/__main__.py

      - name: Pack artifact
        shell: bash
        run: |
          mkdir -p dist-app
          if [ -d dist/portway ]; then
            tar -C dist -czf "dist-app/${{ matrix.artifact }}.tar.gz" portway
          elif [ -f dist/portway.exe ]; then
            cp dist/portway.exe "dist-app/${{ matrix.artifact }}.exe"
          elif [ -f dist/portway ]; then
            cp dist/portway "dist-app/${{ matrix.artifact }}"
          else
            echo "No build output found in dist/" && exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-app/*

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
          # Optional: remove or create CHANGELOG.md in a prior step if it doesn't exist
          body_path: CHANGELOG.md 
