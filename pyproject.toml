[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portway"
version = "0.2.0"
description = "Find and open services on Wi-Fi and Tailscale from a HeroUI desktop app, TUI, CLI, or Flask server."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Portway" }]
keywords = ["ports", "scanner", "tailscale", "wifi", "pywebview", "lan", "discovery", "flask", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Desktop Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
dependencies = [
    "pywebview>=5.1",
    "flask>=3.0",
    "rich>=13.7",
    "textual>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
portway = "portway.app:main"

[project.urls]
Homepage = "https://github.com/portway-app/portway"
Documentation = "https://github.com/portway-app/portway#readme"
Changelog = "https://github.com/portway-app/portway/blob/main/CHANGELOG.md"
Issues = "https://github.com/portway-app/portway/issues"

[tool.setuptools.packages.find]
include = ["portway*"]

[tool.setuptools.package-data]
portway = ["web/*", "web/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
